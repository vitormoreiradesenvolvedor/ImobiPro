# Borda de desenvolvimento: front e API na mesma origem (http://localhost:8080).
# Origem única é o que faz o cookie HttpOnly de refresh funcionar sem gambiarra.

upstream api { server api:8000; }
upstream ws  { server ws:8001; }
upstream web { server web:5173; }

server {
    listen 80;
    server_name localhost;
    client_max_body_size 10m;

    # $http_host preserva a porta (localhost:8080). Com $host, o Django
    # montaria URLs de mídia apontando para a porta 80 e as fotos quebravam.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/    { proxy_pass http://api; }
    location /admin/  { proxy_pass http://api; }
    location /static/ { proxy_pass http://api; }
    location /media/  { proxy_pass http://api; }
    location /health/ { proxy_pass http://api; }

    location /ws/ {
        proxy_pass http://ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Vite dev server, incluindo o WebSocket de hot reload.
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
