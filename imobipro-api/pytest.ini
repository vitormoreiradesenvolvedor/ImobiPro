[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
addopts =
    # A linha de comando vence a variável de ambiente do contêiner
    # (DJANGO_SETTINGS_MODULE=config.settings.development), que de outro modo
    # ignoraria o ajuste acima e rodaria os testes sem Celery em modo eager.
    --ds=config.settings.test
    --strict-markers
    --cov=apps
    --cov-report=term-missing
    --cov-fail-under=80
    -ra
testpaths = apps
