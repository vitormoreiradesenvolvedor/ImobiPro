sonar.projectKey=imobipro
sonar.projectName=ImobiPro
sonar.projectVersion=1.0

# Código de produção dos dois projetos. Migrations são geradas pelo Django e
# testes têm regras próprias, por isso ficam fora da base analisada.
sonar.sources=imobipro-api/apps,imobipro-api/config,imobipro-web/src
sonar.tests=imobipro-api/apps,imobipro-web/tests
sonar.test.inclusions=**/tests/**,**/*.spec.js
sonar.exclusions=**/migrations/**,**/node_modules/**,**/dist/**,**/staticfiles/**,**/media/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=imobipro-api/coverage.xml
sonar.javascript.lcov.reportPaths=imobipro-web/coverage/lcov.info

sonar.sourceEncoding=UTF-8
