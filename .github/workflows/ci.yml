name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend lint, testes e cobertura
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imobipro_test
          POSTGRES_USER: imobipro
          POSTGRES_PASSWORD: imobipro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U imobipro"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      SECRET_KEY: chave-somente-para-o-pipeline-de-integracao-continua
      DEBUG: "False"
      DATABASE_URL: postgres://imobipro:imobipro@localhost:5432/imobipro_test
      REDIS_URL: redis://localhost:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: imobipro-api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements/dev.txt

      - name: Ruff
        run: ruff check .

      - name: Checagem de migrations pendentes
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      # Rodado contra as settings de produção: é o único jeito de o check
      # avaliar HSTS, SSL redirect e cookies seguros de verdade.
      - name: Django system check (produção)
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production

      - name: pytest com cobertura mínima
        run: pytest

  frontend:
    name: Frontend lint, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imobipro-web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: imobipro-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  imagens:
    name: Build das imagens de produção
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - run: docker build --target prod -t imobipro-api:${{ github.sha }} ./imobipro-api
      - run: docker build --target prod -t imobipro-web:${{ github.sha }} ./imobipro-web
