name: imobipro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: imobipro
      POSTGRES_USER: imobipro
      POSTGRES_PASSWORD: imobipro
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imobipro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - dados_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./imobipro-api
      target: dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py semear_operacao &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: ./imobipro-api/.env
    volumes:
      - ./imobipro-api:/app
    ports:
      # 8000 é porta disputada na máquina do desenvolvedor; a entrada de uso é o
      # proxy, na 8080. Esta publicação serve para depurar a API direto.
      - "${API_PORT:-8002}:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5

  ws:
    build:
      context: ./imobipro-api
      target: dev
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    env_file: ./imobipro-api/.env
    volumes:
      - ./imobipro-api:/app
    ports:
      - "${WS_PORT:-8001}:8001"
    depends_on:
      api: { condition: service_started }

  worker:
    build:
      context: ./imobipro-api
      target: dev
    command: celery -A config worker -l info
    env_file: ./imobipro-api/.env
    volumes:
      - ./imobipro-api:/app
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }

  beat:
    build:
      context: ./imobipro-api
      target: dev
    command: celery -A config beat -l info
    env_file: ./imobipro-api/.env
    volumes:
      - ./imobipro-api:/app
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: ./imobipro-web
      target: dev
    command: npm run dev
    # Instalação de uma imobiliária só: a tela de login já sai com a marca dela.
    # Em ambiente multi-imobiliária, deixe vazio e o subdomínio do host decide.
    environment:
      VITE_IMOBILIARIA: "${VITE_IMOBILIARIA:-horizonte}"
    volumes:
      - ./imobipro-web:/app
      - /app/node_modules
    ports:
      # 5173 é a porta padrão do Vite e costuma estar ocupada por outro projeto
      # na máquina do desenvolvedor. A entrada de uso é o proxy, na 8080.
      - "${WEB_PORT:-5174}:5173"
    depends_on:
      - api

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PROXY_PORT:-8080}:80"
    depends_on:
      - api
      - web

volumes:
  dados_postgres:
  dados_redis:
